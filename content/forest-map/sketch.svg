<?xml version="1.0" encoding="UTF-8"?>
<!--
  Forest-map layout sketch. HAND-OWNED after first generation.

  This is the schematic that guides the landscape image model. Edit it freely:
    * move a place: change cx/cy on its circle (id starts with "loc"), and for
      tidiness the x/y of the text beside it
    * reroute a path: edit the d="..." on its path (id starts with "path")
    * retune guidance: edit the red text in the "notes" group; these tell the
      model what terrain belongs where and are NEVER drawn
  Then run the sync command (npm run forest-sketch, sync flag) to write the new
  positions back into content/forest.json.

  Keep edits as plain attribute edits. AVOID wrapping elements in groups with
  transforms: sync tolerates a transform="translate(x,y)" on a loc circle
  itself, but not a transform inherited from a parent group.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== frame: broad terrain regions ===== -->
  <g id="frame">
    <rect x="0" y="0" width="1000" height="1400" fill="#ffffff"/>
    <!-- the mountains -->
    <path d="M 0,0 L 1000,0 L 1000,445 C 900,435 800,425 725,385 C 630,330 520,290 440,300 C 330,320 200,300 0,330 Z" fill="#dce4ee"/>
    <!-- the ocean -->
    <path d="M 1000,455 C 900,445 770,455 722,505 C 694,545 700,620 712,690 C 724,790 760,865 820,908 C 870,940 940,958 1000,962 Z" fill="#cfe3ef" stroke="#4f89ab" stroke-width="3"/>
    <!-- underground band (below the ground line) -->
    <rect x="0" y="1000" width="1000" height="400" fill="#e9dcc4"/>
    <!-- GROUND LINE -->
    <line x1="0" y1="1000" x2="1000" y2="1000" stroke="#5d7a3e" stroke-width="5"/>
  </g>

  <!-- ===== islands in the ocean ===== -->
  <g id="islands" fill="#f1e6c8" stroke="#a8783f" stroke-width="2">
    <circle cx="905" cy="650" r="62"/>
    <path d="M 800,806 C 760,774 756,730 782,724 C 794,720 806,720 818,724 C 844,730 840,774 800,806 Z"/>
    <rect x="753" y="503" width="84" height="84"/>
    <ellipse cx="912" cy="860" rx="66" ry="46" fill="#e05a4a" stroke="none"/><ellipse cx="912" cy="860" rx="56" ry="39" fill="#ee9a45" stroke="none"/><ellipse cx="912" cy="860" rx="46" ry="32" fill="#efd35a" stroke="none"/><ellipse cx="912" cy="860" rx="36" ry="25" fill="#7cb95b" stroke="none"/><ellipse cx="912" cy="860" rx="26" ry="18" fill="#5b8fd0" stroke="none"/><ellipse cx="912" cy="860" rx="16" ry="11" fill="#9a6cc4" stroke="none"/>
  </g>

  <!-- ===== paths: roads, trails, waterways, tunnels ===== -->
  <g id="paths" fill="none" stroke-linecap="round">
    <path id="path--trail-isabella-hattie" d="M 160,885 C 260,780 330,680 380,640 C 420,600 450,540 462,490" stroke="#b89a63" stroke-width="4" stroke-dasharray="10 8"/>
    <path id="path--trail-hattie-peacock" d="M 450,500 C 330,560 200,600 110,612" stroke="#b89a63" stroke-width="4" stroke-dasharray="10 8"/>
    <path id="path--trail-hattie-seeker" d="M 476,490 C 540,560 610,620 680,655" stroke="#b89a63" stroke-width="4" stroke-dasharray="10 8"/>
    <path id="path--trail-peacock-crystal" d="M 466,462 C 476,380 500,280 512,190" stroke="#b89a63" stroke-width="4" stroke-dasharray="10 8"/>
    <path id="path--shaft-mole-tunnel" d="M 300,1000 C 300,1050 290,1100 300,1120 C 260,1140 210,1155 175,1160" stroke="#573a24" stroke-width="14"/>
    <path id="path--tunnel-moles-grisco" d="M 300,1120 C 450,1150 650,1150 810,1144" stroke="#573a24" stroke-width="14"/>
    <path id="path--tunnel-moles-ants" d="M 300,1120 C 330,1190 450,1250 610,1262" stroke="#573a24" stroke-width="14"/>
    <path id="path--shaft-grisco" d="M 640,1000 C 642,1060 640,1110 640,1146" stroke="#573a24" stroke-width="14"/>
  </g>

  <!-- ===== markers: one circle per place (positions synced to forest.json) ===== -->
  <g id="markers">
    <circle id="loc--icicles-palace" cx="190" cy="100" r="14" fill="#7a7f9a" stroke="#ffffff" stroke-width="2"/>
    <text x="190" y="81" fill="#2a2418" font-size="12" text-anchor="middle">Icicle's Palace</text>
    <circle id="loc--crystal-mountain" cx="515" cy="172" r="14" fill="#7a7f9a" stroke="#ffffff" stroke-width="2"/>
    <text x="515" y="153" fill="#2a2418" font-size="12" text-anchor="middle">Crystal Mountain</text>
    <circle id="loc--peacocks-tower" cx="95" cy="612" r="14" fill="#5b8a43" stroke="#ffffff" stroke-width="2"/>
    <text x="95" y="593" fill="#2a2418" font-size="12" text-anchor="middle">Peacock's Tower</text>
    <circle id="loc--seekers-castle" cx="686" cy="662" r="14" fill="#5b8a43" stroke="#ffffff" stroke-width="2"/>
    <text x="686" y="643" fill="#2a2418" font-size="12" text-anchor="middle">Seeker's Castle</text>
    <circle id="loc--hatties-workshop" cx="464" cy="476" r="14" fill="#5b8a43" stroke="#ffffff" stroke-width="2"/>
    <text x="464" y="457" fill="#2a2418" font-size="12" text-anchor="middle">Hattie's Workshop</text>
    <circle id="loc--isabellas-house" cx="160" cy="885" r="14" fill="#5b8a43" stroke="#ffffff" stroke-width="2"/>
    <text x="160" y="866" fill="#2a2418" font-size="12" text-anchor="middle">Isabella's House</text>
    <circle id="loc--circular-island" cx="905" cy="650" r="14" fill="#3f7fa6" stroke="#ffffff" stroke-width="2"/>
    <text x="905" y="631" fill="#2a2418" font-size="12" text-anchor="middle">Circular Island</text>
    <circle id="loc--strawberry-island" cx="800" cy="760" r="14" fill="#3f7fa6" stroke="#ffffff" stroke-width="2"/>
    <text x="800" y="741" fill="#2a2418" font-size="12" text-anchor="middle">Strawberry Island</text>
    <circle id="loc--square-island" cx="795" cy="545" r="14" fill="#3f7fa6" stroke="#ffffff" stroke-width="2"/>
    <text x="795" y="526" fill="#2a2418" font-size="12" text-anchor="middle">Square Island</text>
    <circle id="loc--rainbow-island" cx="912" cy="860" r="14" fill="#3f7fa6" stroke="#ffffff" stroke-width="2"/>
    <text x="912" y="841" fill="#2a2418" font-size="12" text-anchor="middle">Rainbow Island</text>
    <circle id="loc--mole-family-tunnel" cx="168" cy="1162" r="14" fill="#8a5f3c" stroke="#ffffff" stroke-width="2"/>
    <text x="168" y="1143" fill="#2a2418" font-size="12" text-anchor="middle">The Mole Family's Tunnel</text>
    <circle id="loc--uncle-griscos-laboratory" cx="816" cy="1144" r="14" fill="#8a5f3c" stroke="#ffffff" stroke-width="2"/>
    <text x="816" y="1125" fill="#2a2418" font-size="12" text-anchor="middle">Uncle Grisco's Laboratory</text>
    <circle id="loc--ant-kingdom" cx="617" cy="1262" r="14" fill="#8a5f3c" stroke="#ffffff" stroke-width="2"/>
    <text x="617" y="1243" fill="#2a2418" font-size="12" text-anchor="middle">The Ant Kingdom</text>
  </g>

  <!-- ===== notes: instructions for the image model — followed, never drawn ===== -->
  <g id="notes" fill="#c0392b" font-size="15" font-style="italic">
    <text x="330" y="40" text-anchor="middle">snow-capped mountain range: jagged peaks, foothills below</text>
    <text x="860" y="480" text-anchor="middle">open ocean, gentle waves</text>
    <text x="340" y="560" text-anchor="middle">rolling deciduous forest fills the woods</text>
    <text x="860" y="935" text-anchor="middle">sandy beach</text>
    <text x="500" y="988" text-anchor="middle">GROUND LINE: below is a side-on underground soil cross-section</text>
    <text x="500" y="1040" text-anchor="middle">tunnels linking empty burrow chambers · soil strata · tree roots reaching down</text>
    <text x="190" y="144" text-anchor="middle">the tallest, pointiest snowy peak, above the clouds</text>
    <text x="515" y="216" text-anchor="middle">a mountain of glittering multi-colored crystal (purple, pink, rainbow)</text>
    <text x="176.4" y="656" text-anchor="middle">a great open green hill rising above the treetops</text>
    <text x="686" y="706" text-anchor="middle">rocky sea cliff, edge of the woods</text>
    <text x="464" y="520" text-anchor="middle">a huge old hollow tree in a small clearing, heart of the woods</text>
    <text x="160" y="929" text-anchor="middle">a sunny open meadow at the edge of the woods</text>
    <text x="866.8" y="694" text-anchor="middle">round island, small volcano in center</text>
    <text x="798.4" y="804" text-anchor="middle">a real island shaped like a strawberry: beach rim, trees</text>
    <text x="795" y="589" text-anchor="middle">square island, square fields</text>
    <text x="823.6" y="904" text-anchor="middle">forest in concentric rainbow rings, red outermost</text>
    <text x="168" y="1206" text-anchor="middle">large cozy rounded burrow chamber</text>
    <text x="816" y="1188" text-anchor="middle">large rounded burrow chamber</text>
    <text x="617" y="1306" text-anchor="middle">deepest level: a big honeycomb of many small ant chambers</text>
  </g>
</svg>
