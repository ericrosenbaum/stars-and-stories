<?xml version="1.0" encoding="UTF-8"?>
<!--
  Forest-map layout sketch. HAND-OWNED after first generation.

  This is the schematic that guides the landscape image model. Edit it freely:
    * move a place: change cx/cy on its circle (id starts with "loc"), and for
      tidiness the x/y of the text beside it
    * reroute a path: edit the d="..." on its path (id starts with "path")
    * retune guidance: edit the red text in the "notes" group; these tell the
      model what terrain belongs where and are NEVER drawn
  Then run the sync command (npm run forest-sketch, sync flag) to write the new
  positions back into content/forest.json.

  Keep edits as plain attribute edits. AVOID wrapping elements in groups with
  transforms: sync tolerates a transform="translate(x,y)" on a loc circle
  itself, but not a transform inherited from a parent group.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== frame: broad terrain regions ===== -->
  <g id="frame">
    <rect x="0" y="0" width="1000" height="1400" fill="#ffffff"/>
    <!-- mountain band -->
    <rect x="0" y="0" width="1000" height="260" fill="#dce4ee"/>
    <!-- underground band (below the ground line) -->
    <rect x="0" y="1000" width="1000" height="400" fill="#e9dcc4"/>
    <!-- GROUND LINE -->
    <line x1="0" y1="1000" x2="1000" y2="1000" stroke="#5d7a3e" stroke-width="5"/>
  </g>

  <!-- ===== water bodies (ponds / lake / swamp) ===== -->
  <g id="water">
    <ellipse cx="825" cy="875" rx="54" ry="36" fill="#cfe3ef" stroke="#4f89ab" stroke-width="2" opacity="0.85"/>
    <ellipse cx="620" cy="790" rx="78" ry="50" fill="#cfe3ef" stroke="#4f89ab" stroke-width="2" opacity="0.85"/>
    <ellipse cx="720" cy="560" rx="54" ry="36" fill="#cfe3ef" stroke="#4f89ab" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- ===== paths: roads, trails, waterways, tunnels ===== -->
  <g id="paths" fill="none" stroke-linecap="round">
    <path id="path--cornell-street" d="M 120,150 C 210,240 262,330 245,412 C 228,498 270,560 330,588 C 398,618 420,700 430,780 C 442,862 492,932 540,986" stroke="#b89a63" stroke-width="7"/>
    <text x="120" y="144" fill="#6b5c42" font-size="12">Cornell Street</text>
    <path id="path--trail-seeker" d="M 300,565 C 240,600 180,640 142,688" stroke="#b89a63" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="300" y="559" fill="#6b5c42" font-size="12">trail</text>
    <path id="path--trail-peacock" d="M 560,600 C 640,520 700,430 780,330 C 820,275 845,235 862,200" stroke="#b89a63" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="560" y="594" fill="#6b5c42" font-size="12">trail</text>
    <path id="path--the-river" d="M 930,60 C 880,200 902,380 852,520 C 802,660 832,780 858,900 C 868,935 868,962 862,986" stroke="#4f89ab" stroke-width="8"/>
    <text x="930" y="54" fill="#6b5c42" font-size="12">The River</text>
    <path id="path--the-stream" d="M 726,566 C 760,575 800,585 850,560" stroke="#6fa6c4" stroke-width="5"/>
    <text x="726" y="560" fill="#6b5c42" font-size="12">The Stream</text>
    <path id="path--stream-to-pond" d="M 712,585 C 680,650 650,720 632,776" stroke="#6fa6c4" stroke-width="5"/>
