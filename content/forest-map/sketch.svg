    <text x="520" y="990" fill="#6b5c42" font-size="12">tunnel</text>
    <path id="path--mole-train-line" d="M 355,1085 C 420,1130 460,1160 520,1185 C 590,1215 630,1140 680,1120 C 760,1090 850,1180 903,1242" stroke="#573a24" stroke-width="14"/>
