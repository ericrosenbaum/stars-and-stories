    <text x="760" y="340" text-anchor="middle">dense dark forest thicket</text>
    <text x="560" y="270" text-anchor="middle">pine / evergreen grove</text>
    <text x="500" y="988" text-anchor="middle">GROUND LINE — below is a side-on underground soil cross-section</text>
    <text x="500" y="1200" text-anchor="middle">winding tunnels linking empty burrow chambers · soil strata · tree roots reaching down</text>
