    <path id="path--shaft-moles-yard" d="M 350,972 C 352,1010 353,1050 355,1082" stroke="#573a24" stroke-width="14"/>
    <text x="350" y="966" fill="#6b5c42" font-size="12">tunnel</text>
    <path id="path--tunnel-papa-burrow" d="M 355,1085 C 290,1100 210,1120 152,1148" stroke="#573a24" stroke-width="14"/>
    <text x="355" y="1079" fill="#6b5c42" font-size="12">tunnel</text>
    <path id="path--tunnel-burrow-disco" d="M 152,1152 C 185,1190 215,1218 248,1248" stroke="#573a24" stroke-width="14"/>
